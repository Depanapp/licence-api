services:
  mysql:
    image: mysql:8.0
    container_name: fleet_mysql
    restart: always

    environment:
      MYSQL_DATABASE: fleet_license
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: fleet_user
      MYSQL_PASSWORD: fleet_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: